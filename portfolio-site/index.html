<!DOCTYPE html>
<!-- 第 1 行：告诉浏览器"这是 HTML5 文档"，固定写法 -->

<html lang="zh-CN">
<!-- 根标签：所有内容都包在 <html> 里，lang 表示页面语言是中文 -->

<head>
  <!-- 头部：放页面的"说明书"（浏览器看，不显示在页面上） -->
  <meta charset="UTF-8">
  <!-- 编码：UTF-8 才能正常显示中文，否则会乱码 -->
  <title>我的求职主页</title>
  <!-- 标题：显示在浏览器标签页上的文字 -->

  <!-- 连接样式表：告诉浏览器去加载 style.css -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- 页头：导航栏 -->
  <div class="header">
    <h1>江会荣</h1>
    <p>AI 应用开发工程师（求职中）</p>
  </div>

  <!-- 主体：内容区 -->
  <div class="main">
    <h2>我的技能</h2>
    <ul class="skill-list">
      <li>HTML</li>
      <li>JavaScript</li>
      <li>AI 工具开发</li>
    </ul>

    <h2>联系我</h2>
    <a href="https://github.com/Linjiang624">我的 GitHub</a>
    <img src="https://picsum.photos/200" alt="头像">
    <input type="text" placeholder="2974395399@qq.com">
    <button>提交</button>
  </div>

  <!-- 页脚 -->
  <div class="footer">
    <p>© 2026 江会荣 · 用 90 天改变自己</p>
  </div>
</body>


</html>
