<!DOCTYPE html>
<!-- 第 1 行：告诉浏览器"这是 HTML5 文档"，固定写法 -->

<html lang="zh-CN">
<!-- 根标签：所有内容都包在 <html> 里，lang 表示页面语言是中文 -->

<head>
  <!-- 头部：放页面的"说明书"（浏览器看，不显示在页面上） -->
  <meta charset="UTF-8">
  <!-- 编码：UTF-8 才能正常显示中文，否则会乱码 -->
  <title>我的求职主页</title>
  <!-- 标题：显示在浏览器标签页上的文字 -->
</head>

<body>
  <!-- 主体：这里写的内容才会显示在网页上 -->

  <h1>你好，我是 江会荣</h1>
  <!-- h1 = 一级大标题，一般一个页面只有一个 -->

  <p>我的目标是成为一名 AI 应用开发工程师。</p>
  <!-- p = 段落 -->

  <h2>我的技能</h2>
  <!-- h2 = 二级标题，比 h1 小一号 -->

  <ul>
    <!-- ul = 无序列表（unordered list） -->
    <li>HTML（正在学）</li>
    <li>JavaScript</li>
    <li>AI 工具开发</li>
  </ul>
  <!-- li = 列表项（list item），每个 <li> 是一行 -->

  <!-- 链接：href = 要跳转的地址，中间写显示的文字 -->
  <a href="https://github.com/Linjiang624">我的 GitHub</a>

  <!-- 图片：src = 图片地址，alt = 图片坏了时显示的文字 -->
  <img src="https://picsum.photos/200" alt="随机图片">

  <!-- 表单：input = 输入框，button = 按钮 -->
  <input type="text" placeholder="2974395399@qq.com">
  <button>提交</button>

</body>

</html>
