<!DOCTYPE html>
<!-- 第 1 行：告诉浏览器"这是 HTML5 文档"，固定写法 -->

<html lang="zh-CN">
<!-- 根标签：所有内容都包在 <html> 里，lang 表示页面语言是中文 -->

<head>
  <!-- 头部：放页面的"说明书"（浏览器看，不显示在页面上） -->
  <meta charset="UTF-8">
  <!-- 编码：UTF-8 才能正常显示中文，否则会乱码 -->
  <title>我的求职主页</title>
  <!-- 标题：显示在浏览器标签页上的文字 -->

  <!-- 连接样式表：告诉浏览器去加载 style.css -->
  <link rel="stylesheet" href="style.css">

  <!-- 加载密钥配置（本文件已被 git 忽略，不会上传） -->
  <script src="config.js"></script>
</head>

<body>
  <!-- 页头：导航栏 -->
  <div class="header">
    <h1>江会荣</h1>
    <p>AI 应用开发工程师（求职中）</p>
  </div>

  <!-- 主体：内容区 -->
  <div class="main">
    <h2 id="skill-title">我的技能</h2>
    <ul class="skill-list" id="skill-list"></ul>

    <h2>每日名言</h2>
    <p id="quote">点击按钮获取一句名言</p>
    <button id="quote-btn">换一句</button>

    <h2>AI 求职助手</h2>
    <!-- 聊天窗口：消息都显示在这里 -->
    <div id="chat-box"></div>
    <!-- 输入区：输入框 + 发送按钮 -->
    <div id="chat-input-area">
      <input id="ai-input" type="text" placeholder="输入你的问题，回车发送">
      <button id="ai-btn">发送</button>
    </div>

    <h2>JD 分析器</h2>
    <p>粘贴一段招聘 JD，AI 帮你提取岗位要求：</p>
    <textarea id="jd-input" rows="6" placeholder="把招聘 JD 粘贴到这里……"></textarea>
    <button id="jd-btn">分析 JD</button>
    <div id="jd-result">（分析结果会显示在这里）</div>

    <h2>联系我</h2>
    <a href="https://github.com/Linjiang624">我的 GitHub</a>
    <img src="https://picsum.photos/200" alt="头像">
    <input type="text" placeholder="你的名字">
    <button id="submit-btn">提交</button>
  </div>

  <!-- 页脚 -->
  <div class="footer">
    <p>© 2026 江会荣 · 用 90 天改变自己</p>
  </div>

  <script>
      // ===== 用数组 + 循环自动生成技能列表 =====
  const skills = ["HTML", "JavaScript", "AI 工具开发"];  // 数据

  const skillList = document.querySelector("#skill-list");  // 找空列表

  for (let i = 0; i < skills.length; i++) {
    const li = document.createElement("li");  // 创建一个 <li> 元素
    li.textContent = skills[i];               // 把技能名写进去
    skillList.appendChild(li);                // 把 <li> 挂到列表里
  }

  // ===== 点击标题折叠/展开技能列表 =====
  const skillTitle = document.querySelector("#skill-title");  // 找标题

  skillTitle.addEventListener("click", function () {
    if (skillList.style.display === "none") {
      skillList.style.display = "flex";   // 如果隐藏着，就显示
    } else {
      skillList.style.display = "none";   // 如果显示着，就隐藏
    }
  });
  // 找到页面元素（先找好，存进变量）
  const button = document.querySelector("#submit-btn");
  const input = document.querySelector("input");
  const header = document.querySelector(".header");

  // 定义一个函数：根据名字生成问候语并显示
  function showGreeting() {
    const message = input.value;          // 读输入框
    header.innerHTML = "<h1>你好，" + message + "！</h1>";  // 写页头
  }
  

  // 绑定点击事件：点击按钮 → 调用 showGreeting 函数
  button.addEventListener("click", showGreeting);

  // ===== 每日名言功能 =====
  const quoteBtn = document.querySelector("#quote-btn");
  const quote = document.querySelector("#quote");

  function getQuote() {
    // 一言 API（国内稳定）：每次请求返回一句随机名言
    fetch("https://v1.hitokoto.cn/")
      .then(res => res.json())       // 解析响应为 JSON
      .then(data => {
        // 一言返回的字段：hitokoto=句子，from=出处
        quote.textContent = data.hitokoto + " —— " + data.from;
      })
      .catch(err => {
        // 网络出错时显示提示，而不是悄悄失败
        quote.textContent = "获取失败，请检查网络";
        console.log(err);
      });
  }

  // 点击"换一句"按钮 → 获取新名言
  quoteBtn.addEventListener("click", getQuote);

  // ===== AI 求职助手：多轮对话版 =====
  const aiBtn = document.querySelector("#ai-btn");
  const aiInput = document.querySelector("#ai-input");
  const chatBox = document.querySelector("#chat-box");

  // 我的简历资料（AI 回答时会参考它）
  const 简历资料 = [
    "姓名：江会荣",
    "求职方向：AI 应用开发工程师（初级）",
    "技术栈：HTML、CSS、JavaScript 基础，正在学习大模型 API 调用",
    "项目：90 天求职冲刺计划（在线求职主页，含 AI 问答功能）",
    "背景：零基础转行，全职自学，目标 3 个月内入职",
    "期望：小公司/外包/初创团队，愿意从基础做起"
  ].join("\n");

  // 对话历史：第一句是"系统设定"，之后每次问答都追加进去
  const chatHistory = [
    { role: "system", content: "你是求职辅导助手，用中文简洁回答。以下是我的简历资料，回答时要结合它：\n" + 简历资料 }
  ];

  // 把一条消息显示到聊天窗口
  function addMessage(role, text) {
    const div = document.createElement("div");   // 创建气泡
    div.className = "chat-msg " + role;           // 加样式类：user 或 ai
    div.textContent = text;                       // 写入文字
    chatBox.appendChild(div);                     // 挂到窗口
    chatBox.scrollTop = chatBox.scrollHeight;     // 自动滚动到底部
  }

  async function askAI() {
    const question = aiInput.value;
    if (question === "") return;

    addMessage("user", question);                                  // ① 屏幕上显示用户的话
    chatHistory.push({ role: "user", content: question });         // ② 记入对话历史
    aiInput.value = "";                                            // ③ 清空输入框
    aiBtn.disabled = true;                                         // ④ 防重复点击

    try {
      const response = await fetch("https://api.deepseek.com/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + DEEPSEEK_API_KEY
        },
        body: JSON.stringify({
          model: "deepseek-chat",
          messages: chatHistory   // ⭐ 关键：把【整个历史】发给 AI，它就能"记住"前面的话
        })
      });

      const data = await response.json();
      const reply = data.choices[0].message.content;

      addMessage("ai", reply);                                      // ⑤ 屏幕上显示 AI 的回答
      chatHistory.push({ role: "assistant", content: reply });      // ⑥ AI 的回答也记入历史
    } catch (err) {
      addMessage("ai", "调用失败：" + err.message);
      console.log(err);
    }

    aiBtn.disabled = false;
  }

  // 点"发送"按钮提问
  aiBtn.addEventListener("click", askAI);
  // 按回车键也能发送（聊天软件的标配）
  aiInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") askAI();
  });

  // ===== JD 分析器：粘贴 JD → 提取岗位要求 =====
  const jdBtn = document.querySelector("#jd-btn");
  const jdInput = document.querySelector("#jd-input");
  const jdResult = document.querySelector("#jd-result");

  async function analyzeJD() {
    const jd = jdInput.value;
    if (jd === "") {
      jdResult.textContent = "请先粘贴一段 JD";
      return;
    }

    jdResult.textContent = "分析中……";
    jdBtn.disabled = true;

    try {
      const response = await fetch("https://api.deepseek.com/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + DEEPSEEK_API_KEY
        },
        body: JSON.stringify({
          model: "deepseek-chat",
          messages: [
            {
              role: "system",
              content: "你是资深技术招聘专家。用户会给你一段招聘 JD，请提取：\n" +
                       "1. 岗位职责（3-5 条）\n" +
                       "2. 硬性要求（必须满足的）\n" +
                       "3. 加分项（优先考虑的）\n" +
                       "4. 面试可能考察的技术点\n" +
                       "用中文，分点列出，简洁专业。"
            },
            { role: "user", content: jd }
          ]
        })
      });

      const data = await response.json();
      jdResult.textContent = data.choices[0].message.content;
    } catch (err) {
      jdResult.textContent = "分析失败：" + err.message;
      console.log(err);
    }

    jdBtn.disabled = false;
  }

  jdBtn.addEventListener("click", analyzeJD);
  </script>
</body>


</html>
